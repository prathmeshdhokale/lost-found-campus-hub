spring.application.name=lost-found-campus-hub
server.port=8080
#spring.datasource.url=jdbc:mysql://localhost:3306/lost_found?createDatabaseIfNotExist=true
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lost_found?createDatabaseIfNotExist=true}
#spring.datasource.username=root
spring.datasource.username=${DB_USERNAME:root}
#spring.datasource.password=root123
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-this-32-chars-minimum}
app.jwt.expiration-ms=86400000
#cloudinary.cloud-name=pxvewbf2
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
#cloudinary.api-key=284755211393714
cloudinary.api-key=${CLOUDINARY_API_KEY:}
#cloudinary.api-secret=jaRKWwAm3-mNEBBFr04E1k0VtX0
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB









cloudinary.api-secret=${CLOUDINARY_API_SECRET:}